name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : le jeton du workflow ne peut que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées par empreinte de commit (et non par tag, qui peut bouger).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build
        run: npm run build
      - name: Les pages versionnées sont à jour
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Pages non régénérées : lance « npm run build » et committe le résultat."
            exit 1
          fi
      - name: Vérifications (ancres, fichiers, métadonnées, CSP)
        run: node scripts/check.mjs
